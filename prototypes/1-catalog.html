<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Card Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
PLAN
Palette: card #FFFFFE, catalog blue #2B5C9E (rules #B9CDE6), header red #C4262E,
stamp violet #5A3D9A, oak #8A5A34 / #5E3B20, floor #E6EAE3 (institutional sage, not cream), ink #1B2230.
Goal pair: violet (everyone else) vs red (white men); untagged = graphite #7D828C.
Type: Courier Prime only for what is typed on cards and slips (real italics/bold, more legible
than Cutive Mono at small sizes). Public Sans (the US government's institutional face) for UI.
Layout: library letterhead, circulation counter; pocket cards (reading) + hold slips (up next);
an open oak drawer with year guide cards as tabs, filled with 3x5 catalog cards.
Dashboard = a ruled circulation report with the goal rubber-stamped.
Principles: the drawer + stamps are loud; everything else is quiet printed matter. Uppercase only on stamps.
Review: avoided cream+serif, SaaS cards (cards here are literal index cards, square-cornered, with a rod hole),
eyebrow labels, mono data labels outside typed cards, middle-dot spec lines, pill buttons.
-->
<style>
:root{
  --card:#FFFFFE; --rule:#B9CDE6; --blue:#2B5C9E; --red:#C4262E; --violet:#5A3D9A;
  --oak:#8A5A34; --oak-d:#5E3B20; --oak-l:#A9744A; --floor:#E6EAE3; --ink:#1B2230; --muted:#5A6170;
  --graphite:#7D828C; --guide:#E9DFC7; --line:#CBD2CB;
  --type:"Courier Prime", ui-monospace, monospace;
  --sans:"Public Sans", system-ui, sans-serif;
  --lh:22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:400 16px/1.5 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;box-shadow:0 0 0 5px #fff}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* letterhead */
.top{border-bottom:1px solid var(--line);background:#F4F6F2}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-top:20px;padding-bottom:0}
.mast{padding-bottom:14px}
.mast h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.mast p{margin:4px 0 0;color:var(--muted);font-size:15px}
.views{display:flex;gap:4px}
.views button{border:1px solid var(--line);border-bottom:none;background:#E9ECE6;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1px}
.views button[aria-selected="true"]{background:var(--floor);border-color:var(--line);color:var(--ink);box-shadow:inset 0 3px 0 var(--red)}

/* counter */
.counter{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 8px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.counter div{padding:10px 12px 12px;border-left:1px solid var(--line)}
.counter div:first-child{border-left:none;padding-left:0}
.counter b{display:block;font-size:30px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.counter span{color:var(--muted);font-size:14px}

h2{font-size:21px;line-height:1.25;margin:40px 0 4px;font-weight:700}
.sub{margin:0 0 16px;color:var(--muted);font-size:15px;max-width:68ch}

/* nightstand: pocket cards */
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:start}
.pockets{display:grid;gap:20px}
.pocket{position:relative;padding-top:64px}
.pocket .pcard{position:absolute;left:18px;right:18px;top:0;height:120px;background:var(--card);border:1px solid #D7DDE6;
  background-image:linear-gradient(var(--red),var(--red)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--rule) 21px 22px);
  background-size:100% 2px,100% 100%;background-position:0 30px,0 8px;background-repeat:no-repeat,repeat;padding:6px 14px;font-family:var(--type);font-size:14px;line-height:var(--lh)}
.pcard .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pocket .sleeve{position:relative;background:var(--guide);border:1px solid #CDBF9C;min-height:120px;padding:44px 16px 14px;display:flex;gap:14px;align-items:flex-end;justify-content:space-between;
  clip-path:polygon(0 0,38% 0,42% 14px,58% 14px,62% 0,100% 0,100% 100%,0 100%)}
.sleeve .meta{font-size:14px;color:#4A4231;line-height:1.45}
.sleeve .meta strong{display:block;color:var(--ink);font-size:15px}
.sleeve img{width:52px;height:78px;object-fit:cover;flex:none;border:1px solid rgba(0,0,0,.15);background:#fff}

.holds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0;border-top:1px solid var(--ink)}
.slip{display:grid;grid-template-columns:2.2em 1fr;gap:0 6px;padding:8px 6px 9px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.35}
.slip .n{font-family:var(--type);color:var(--violet);font-weight:700;text-align:right}
.slip .tt{font-family:var(--type);font-weight:700}
.slip .au{grid-column:2;color:var(--muted);font-size:13px}

/* year guide cards */
.guides{display:flex;flex-wrap:wrap;gap:6px 6px;padding:14px 14px 0;align-items:flex-end}
.guides button{background:var(--guide);border:1px solid #CDBF9C;border-bottom:none;border-radius:6px 6px 0 0;padding:6px 12px 8px;min-width:58px;font-weight:700;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums;position:relative;top:0;transition:top .12s}
.guides button small{display:block;font-weight:500;font-size:12px;color:#6B5F45}
.guides button[aria-pressed="true"]{background:var(--card);top:-6px;box-shadow:inset 0 3px 0 var(--red);border-color:#E3E3E3}
.guides button:hover{top:-3px}
.guides button[aria-pressed="true"]:hover{top:-6px}

/* drawer */
.drawer{margin-top:22px;background:var(--oak-d);border-radius:4px;box-shadow:inset 0 0 0 10px var(--oak),inset 0 0 0 11px #4B2E18}
.drawer-front{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--oak);padding:14px 18px;border-radius:4px 4px 0 0;
  background-image:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08))}
.plate{display:flex;align-items:center;gap:12px;color:#F6EDE2}
.holder{background:linear-gradient(#D9B76A,#B48F43);padding:4px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.holder span{display:block;background:var(--card);color:var(--ink);font-family:var(--type);font-weight:700;font-size:15px;padding:2px 12px;min-width:130px;text-align:center}
.plate .count{font-size:15px}
.sorter{display:flex;align-items:center;gap:8px;color:#F6EDE2;font-size:14px}
.sorter select{font:600 14px var(--sans);padding:6px 8px;border:1px solid #4B2E18;border-radius:3px;background:#F6EDE2;color:var(--ink)}
.tray{padding:4px 22px 26px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:0;padding:18px 0 0;background:var(--card);background:transparent}
.empty{color:#F6EDE2;padding:20px 0}

/* catalog card */
.cc{position:relative;aspect-ratio:5/3;min-height:186px;background:var(--card);padding:6px 14px 0 14px;font-family:var(--type);font-size:14px;line-height:var(--lh);overflow:hidden;
  background-image:linear-gradient(var(--red),var(--red)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--rule) 21px 22px);
  background-size:100% 2px,100% 100%;background-position:0 30px,0 8px;background-repeat:no-repeat,repeat;
  box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(30,16,4,.28)}
.cc::after{content:"";position:absolute;left:50%;bottom:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--oak-d);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.cc .au{display:block;height:var(--lh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:46px}
.cc .ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;margin-top:4px;padding-right:46px}
.cc .sp{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .cv{position:absolute;right:12px;top:8px;width:38px;height:56px;object-fit:cover;border:1px solid rgba(0,0,0,.18);background:#eee;transform:rotate(2deg)}
.marks{letter-spacing:1px;color:var(--blue)}
.marks i{font-style:normal;color:var(--rule)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:12px;font-weight:600}
.tag::before{content:"";width:9px;height:9px;background:currentColor;display:inline-block}
.t-wm{color:var(--red)} .t-ee{color:var(--violet)} .t-un{color:var(--graphite)}

/* the stamp */
.stamp{position:absolute;right:14px;bottom:14px;font-family:var(--sans);font-weight:800;text-transform:uppercase;color:var(--violet);
  border:2px solid currentColor;outline:1px solid currentColor;outline-offset:2px;padding:2px 7px 1px;font-size:13px;letter-spacing:.08em;line-height:1.2;
  opacity:.86;mix-blend-mode:multiply;transform:rotate(var(--r,0deg)) translate(var(--dx,0),var(--dy,0));white-space:nowrap;background:rgba(255,255,255,.0)}
.stamp small{display:block;font-size:8.5px;letter-spacing:.18em;font-weight:700;text-align:center}
.stamp.none{color:var(--graphite)}
.thunk .stamp{animation:thunk .28s cubic-bezier(.3,1.6,.6,1) both;animation-delay:calc(var(--i,0) * 18ms)}
@keyframes thunk{from{opacity:0;transform:rotate(var(--r)) scale(1.5)}to{opacity:.86;transform:rotate(var(--r)) translate(var(--dx),var(--dy)) scale(1)}}

/* dashboard / circulation report */
.report{background:var(--card);margin:28px 0 48px;border-top:6px solid var(--blue);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.report-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;padding:18px 24px;border-bottom:2px solid var(--ink)}
.report-head h2{margin:0;font-size:24px}
.report-head p{margin:0;color:var(--muted);font-size:14px}
.report .guides{background:var(--oak-d);padding-top:16px;border-bottom:4px solid var(--oak)}
.sec{padding:22px 24px 26px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 14px;font-size:17px;font-weight:700}
.sec h3 span{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2 > .sec:first-child{border-right:1px solid var(--line)}

.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.tallies{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 34px}
.tallies b{display:block;font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.tallies span{font-size:14px;color:var(--muted)}
.tallies .ee b{color:var(--violet)} .tallies .wm b{color:var(--red)} .tallies .un b{color:var(--graphite)}
.split{display:flex;height:14px;margin-top:16px;max-width:520px;background:#EEF0F3}
.split i{display:block;height:100%}
.goal-note{margin:10px 0 0;font-size:15px;max-width:60ch}
.bigstamp{font-family:var(--sans);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:30px;line-height:1.05;padding:10px 18px 8px;border:4px solid currentColor;outline:2px solid currentColor;outline-offset:4px;
  transform:rotate(-7deg);text-align:center;mix-blend-mode:multiply;opacity:.9;margin:10px 18px 10px 0}
.bigstamp small{display:block;font-size:11px;letter-spacing:.24em;margin-top:4px}
.bigstamp.ok{color:var(--violet)} .bigstamp.no{color:var(--red)} .bigstamp.even{color:var(--graphite)}
.thunk .bigstamp{animation:big .34s cubic-bezier(.3,1.6,.6,1) both}
@keyframes big{from{opacity:0;transform:rotate(-7deg) scale(1.6)}to{opacity:.9;transform:rotate(-7deg) scale(1)}}

.form{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
.form div{padding:10px 12px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.form div:last-child{border-right:none}
.form label{display:block;font-size:13px;color:var(--muted)}
.form output{display:block;font-family:var(--type);font-size:22px;font-weight:700;line-height:1.3}
.form output small{font-size:14px;font-weight:400}
.form p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

.cols{display:flex;align-items:flex-end;gap:6px;height:180px;border-bottom:1px solid var(--ink);padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.col i{display:block;width:100%}
.col .v{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.colx{display:flex;gap:6px;margin-top:4px}
.colx span{flex:1;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px}

.rows{display:grid;gap:5px}
.row{display:grid;grid-template-columns:minmax(70px,9em) 1fr 5.2em;gap:10px;align-items:center;font-size:14px}
.row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bar{height:12px;background:#EEF0F3}
.row .bar i{display:block;height:100%;background:var(--blue)}
.row .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.row.rate .lab{font-family:var(--type)}

.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.ledger li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.ledger li small{display:block;color:var(--muted);font-size:12.5px}
.tally{display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.tally svg{display:block}
.tally em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:4.6em;text-align:right}
.places{columns:2;column-gap:28px}
.places li{break-inside:avoid}

footer{color:var(--muted);font-size:13px;padding:0 0 40px}

@media (max-width:820px){
  .desk{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .grid2 > .sec:first-child{border-right:none}
  .form{grid-template-columns:1fr 1fr}
  .goal{grid-template-columns:1fr}
  .bigstamp{justify-self:start}
}
@media (max-width:520px){
  .counter{grid-template-columns:1fr 1fr}
  .counter div:nth-child(3){border-left:none;padding-left:0}
  .counter div:nth-child(n+3){border-top:1px solid var(--line)}
  .cards{grid-template-columns:1fr}
  .tray{padding:4px 12px 20px}
  .tallies{gap:4px 20px}
  .tallies b{font-size:34px}
  .sec{padding:18px 16px 22px}
  .report-head{padding:16px}
  .places{columns:1}
  .holder span{min-width:0}
  .mast h1{font-size:24px}
  .views button{padding:9px 13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="mast">
      <h1>The reading catalog</h1>
      <p>Every book read, reading, on hold and returned unfinished.</p>
    </div>
    <div class="views" role="tablist" aria-label="View">
      <button role="tab" id="tab-books" aria-controls="v-books" aria-selected="true">Books</button>
      <button role="tab" id="tab-dash" aria-controls="v-dash" aria-selected="false">Dashboard</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="v-books" role="tabpanel" aria-labelledby="tab-books">
    <div class="counter" id="counter"></div>

    <h2>On the nightstand</h2>
    <p class="sub" id="ns-sub"></p>
    <div class="desk">
      <div>
        <div class="pockets" id="pockets"></div>
      </div>
      <div>
        <h3 class="sr">Up next</h3>
        <div class="holds" id="holds"></div>
      </div>
    </div>

    <h2>The finished drawer</h2>
    <p class="sub">One card per finished book, stamped with the day it was returned. Pick a year from the guide cards.</p>
    <div class="drawer">
      <div class="guides" id="guides-books" role="group" aria-label="Year"></div>
      <div class="drawer-front">
        <div class="plate"><div class="holder"><span id="plate-label"></span></div><span class="count" id="plate-count"></span></div>
        <label class="sorter">Sort by
          <select id="sort">
            <option value="new">Finished, newest first</option>
            <option value="old">Finished, oldest first</option>
            <option value="rate">Rating, highest first</option>
            <option value="title">Title, A to Z</option>
          </select>
        </label>
      </div>
      <div class="tray"><div class="cards" id="cards"></div></div>
    </div>
  </section>

  <section id="v-dash" role="tabpanel" aria-labelledby="tab-dash" hidden>
    <div class="report">
      <div class="report-head"><h2 id="rep-title">Circulation report</h2><p id="rep-asof"></p></div>
      <div class="guides" id="guides-dash" role="group" aria-label="Year"></div>
      <div id="report"></div>
    </div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>

<script src="books-data.js"></script>
<script>
(function(){
"use strict";
const BOOKS = window.BOOKS, AS_OF = window.AS_OF;
const CUR = AS_OF.slice(0,4);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const state = { year: CUR, sort: "new", view: "books" };

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const fmt = n => n.toLocaleString("en-US");
const authors = b => (b.author || []).join(", ");
const fyear = b => b.finished_at ? b.finished_at.slice(0,4) : null;
function dateLong(iso){ const [y,m,d] = iso.split("-"); return MON[+m-1] + " " + (+d) + ", " + y; }
function dateStamp(iso){ const [y,m,d] = iso.split("-"); return MON[+m-1] + " " + String(+d).padStart(2,"0") + " " + y; }
function hash(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h >>> 0; }
function tagOf(b){ return b.white_male_author === true ? "wm" : b.white_male_author === false ? "ee" : "un"; }
const TAGNAME = { wm:"White man", ee:"Everyone else", un:"Untagged" };
const TAGCOL = { wm:"var(--red)", ee:"var(--violet)", un:"var(--graphite)" };
function marks(r){ if (r == null) return '<span class="marks"><i>········</i></span> unrated'; return '<span class="marks" aria-hidden="true">' + "■".repeat(r) + "<i>" + "□".repeat(8-r) + "</i></span> " + r + "/8"; }

const read = BOOKS.filter(b => b.status === "read");
const YEARS = [...new Set(read.map(fyear).filter(Boolean))].sort().reverse();

function scoped(year){ return year === "all" ? read : read.filter(b => fyear(b) === year); }

function goal(list){
  const t = { ee:0, wm:0, un:0 };
  list.forEach(b => t[tagOf(b)]++);
  return t;
}
function verdict(t, year){
  const live = year === CUR;
  if (t.ee > t.wm) return { cls:"ok", word: live ? "Ahead" : "Goal met", note: live ? "Everyone else leads by " + plural(t.ee - t.wm, "book") + " so far this year." : "Everyone else outnumbered white men by " + plural(t.ee - t.wm, "book") + "." };
  if (t.ee < t.wm) return { cls:"no", word: live ? "Behind" : "Not met", note: live ? "White men lead by " + plural(t.wm - t.ee, "book") + "; " + plural(t.wm - t.ee + 1, "book") + " by everyone else would put the goal ahead." : "White men outnumbered everyone else by " + plural(t.wm - t.ee, "book") + "." };
  return { cls:"even", word:"Tied", note: live ? "Dead even. The next book decides it." : "An even split, so the goal was not met." };
}
function stats(list){
  const pages = list.reduce((s,b) => s + (b.pages || 0), 0);
  const rated = list.filter(b => b.rating != null);
  const avg = rated.length ? rated.reduce((s,b) => s + b.rating, 0) / rated.length : null;
  const aud = list.filter(b => b.audible === true).length, prn = list.filter(b => b.audible === false).length;
  return { books:list.length, pages, avg, rated:rated.length, aud, prn, unrec:list.length - aud - prn };
}
function countBy(list, fn){
  const m = new Map();
  list.forEach(b => { const ks = fn(b); (Array.isArray(ks) ? ks : [ks]).forEach(k => { if (k == null) return; m.set(k, (m.get(k) || 0) + 1); }); });
  return m;
}
function sorted(list){
  const l = list.slice();
  const fin = b => b.finished_at || "";
  if (state.sort === "new") l.sort((a,b) => fin(b).localeCompare(fin(a)) || a.title.localeCompare(b.title));
  if (state.sort === "old") l.sort((a,b) => (fin(a) || "9").localeCompare(fin(b) || "9") || a.title.localeCompare(b.title));
  if (state.sort === "rate") l.sort((a,b) => (b.rating || 0) - (a.rating || 0) || fin(b).localeCompare(fin(a)));
  if (state.sort === "title") l.sort((a,b) => a.title.localeCompare(b.title));
  return l;
}

/* ---------- books view ---------- */
function renderCounter(){
  const c = s => BOOKS.filter(b => b.status === s).length;
  document.getElementById("counter").innerHTML =
    [[c("read"),"read"],[c("reading"),"reading now"],[c("to-read"),"on hold, up next"],[c("abandoned"),"returned unfinished"]]
    .map(([n,l]) => `<div><b>${n}</b><span>${n === 1 ? "book" : "books"} ${l}</span></div>`).join("");
}
function daysBetween(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function renderNightstand(){
  const now = BOOKS.filter(b => b.status === "reading").sort((a,b) => (b.started_at||"").localeCompare(a.started_at||""));
  const next = BOOKS.filter(b => b.status === "to-read");
  document.getElementById("ns-sub").textContent = plural(now.length, "book") + " checked out, " + plural(next.length, "book") + " on the hold shelf.";
  document.getElementById("pockets").innerHTML = now.map(b => {
    const days = b.started_at ? daysBetween(b.started_at, AS_OF) : null;
    const h = hash(b.slug), r = ((h % 9) - 4) * 0.8;
    return `<article class="pocket">
      <div class="pcard"><div>${esc(authors(b))}</div><div class="t" title="${esc(b.title)}">${esc(b.title)}</div><div>${b.pages ? b.pages + " pages" : "pages not recorded"}${b.audible === true ? ", audiobook" : b.audible === false ? ", print" : ""}</div>
        ${b.started_at ? `<span class="stamp" style="--r:${r}deg;right:12px;bottom:auto;top:66px"><small>Date out</small>${dateStamp(b.started_at)}</span>` : ""}</div>
      <div class="sleeve">
        <div class="meta"><strong>${esc(b.title)}</strong>${days != null ? "Out " + plural(days, "day") + ", since " + dateLong(b.started_at) : "Start date not recorded"}<br><span class="tag t-${tagOf(b)}">${TAGNAME[tagOf(b)]}</span></div>
        ${b.cover_image ? `<img src="${esc(b.cover_image)}" alt="" loading="lazy">` : ""}
      </div></article>`;
  }).join("");
  document.getElementById("holds").innerHTML = next.map((b,i) =>
    `<div class="slip"><span class="n">${i+1}</span><span class="tt">${esc(b.title)}</span><span class="au">${esc(authors(b))}${b.pages ? ", " + b.pages + " pages" : ""}</span></div>`).join("");
}
function guideHTML(){
  const opts = [["all","All", read.length]].concat(YEARS.map(y => [y, y, scoped(y).length]));
  return opts.map(([v,l,n]) => `<button type="button" data-year="${v}" aria-pressed="${state.year === v}">${l}<small>${n} books</small></button>`).join("");
}
function card(b, i){
  const t = tagOf(b), h = hash(b.slug);
  const r = ((h % 15) - 7) * 0.9, dx = ((h >> 4) % 7) - 3, dy = ((h >> 8) % 5) - 2;
  const fmtLine = [b.pages ? b.pages + " pages" : "pages not recorded", b.audible === true ? "audiobook" : b.audible === false ? "print" : null].filter(Boolean).join(", ");
  const stamp = b.finished_at
    ? `<span class="stamp" style="--r:${r.toFixed(1)}deg;--dx:${dx}px;--dy:${dy}px;--i:${Math.min(i,30)}"><small>Returned</small>${dateStamp(b.finished_at)}</span>`
    : `<span class="stamp none" style="--r:${r.toFixed(1)}deg;--i:${Math.min(i,30)}"><small>Returned</small>Date unknown</span>`;
  return `<article class="cc" aria-label="${esc(b.title)} by ${esc(authors(b))}">
    ${b.cover_image ? `<img class="cv" src="${esc(b.cover_image)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
    <span class="au">${esc(authors(b))}</span>
    <span class="ti" title="${esc(b.title)}">${esc(b.title)}</span>
    <span class="sp">${fmtLine}</span>
    <span class="sp">${marks(b.rating)}</span>
    <span class="sp"><span class="tag t-${t}">${TAGNAME[t]}</span></span>
    ${b.finished_at ? `<span class="sr">Finished ${dateLong(b.finished_at)}</span>` : ""}
    ${stamp}
  </article>`;
}
function renderShelf(animate){
  const list = sorted(scoped(state.year));
  document.getElementById("guides-books").innerHTML = guideHTML();
  document.getElementById("plate-label").textContent = state.year === "all" ? "All years" : "Finished " + state.year;
  const pages = list.reduce((s,b) => s + (b.pages || 0), 0);
  document.getElementById("plate-count").textContent = plural(list.length, "card") + ", " + fmt(pages) + " pages";
  const el = document.getElementById("cards");
  el.innerHTML = list.length ? list.map(card).join("") : `<p class="empty">No books finished in ${state.year}.</p>`;
  el.classList.remove("thunk"); if (animate){ void el.offsetWidth; el.classList.add("thunk"); }
}

/* ---------- dashboard ---------- */
function tallySVG(n){
  const groups = Math.floor(n/5), rest = n % 5; let x = 0, s = "";
  for (let g=0; g<groups; g++){ for (let k=0;k<4;k++) s += `<line x1="${x+k*4+1}" y1="2" x2="${x+k*4+1}" y2="16"/>`; s += `<line x1="${x-1}" y1="13" x2="${x+16}" y2="5"/>`; x += 22; }
  for (let k=0;k<rest;k++) s += `<line x1="${x+k*4+1}" y1="2" x2="${x+k*4+1}" y2="16"/>`;
  const w = Math.max(x + rest*4 + 2, 2);
  return `<svg width="${w}" height="18" viewBox="0 0 ${w} 18" aria-hidden="true" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${s}</svg>`;
}
function rows(entries, opts){
  opts = opts || {};
  const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="rows">${entries.map(([k,v]) => `<div class="row${opts.cls ? " " + opts.cls : ""}"><span class="lab" title="${esc(k)}">${esc(opts.label ? opts.label(k) : k)}</span><span class="bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><span class="num">${plural(v,"book")}</span></div>`).join("")}</div>`;
}
function stackCols(buckets){
  const max = Math.max(1, ...buckets.map(b => b.ee + b.wm + b.un));
  const bars = buckets.map(b => {
    const tot = b.ee + b.wm + b.un, h = tot / max * 100;
    const seg = k => b[k] ? `<i style="height:${(b[k]/tot*100).toFixed(2)}%;background:${TAGCOL[k]}"></i>` : "";
    return `<div class="col" role="img" aria-label="${esc(b.label)}: ${plural(tot,"book")} (${b.ee} everyone else, ${b.wm} white men, ${b.un} untagged)">
      <span class="v" style="bottom:calc(${h}% + 2px)">${tot || ""}</span>
      <div style="height:${h}%;display:flex;flex-direction:column-reverse">${seg("ee")}${seg("wm")}${seg("un")}</div></div>`;
  }).join("");
  return `<div class="cols">${bars}</div><div class="colx">${buckets.map(b => `<span>${esc(b.short)}</span>`).join("")}</div>
    <div class="legend">${["ee","wm","un"].map(k => `<span class="tag t-${k}">${TAGNAME[k]}</span>`).join("")}</div>`;
}
function renderDash(animate){
  const y = state.year, list = scoped(y), t = goal(list), v = verdict(t, y), s = stats(list);
  document.getElementById("guides-dash").innerHTML = guideHTML();
  document.getElementById("rep-title").textContent = "Circulation report, " + (y === "all" ? "all years" : y);
  document.getElementById("rep-asof").textContent = "Counted " + dateLong(AS_OF);
  const tot = t.ee + t.wm + t.un || 1;

  // month / year buckets
  let buckets, monthTitle, monthNote = "";
  if (y === "all"){
    const lo = +YEARS[YEARS.length-1], hi = +YEARS[0]; buckets = [];
    for (let yy = lo; yy <= hi; yy++){ const l = read.filter(b => fyear(b) === String(yy)); const g = goal(l); buckets.push(Object.assign(g, { label:String(yy), short:"’" + String(yy).slice(2) })); }
    monthTitle = "Books finished by year";
    const undated = read.filter(b => !b.finished_at).length;
    if (undated) monthNote = plural(undated, "read book") + " with no finish date " + (undated === 1 ? "is" : "are") + " counted everywhere else but can't be placed here.";
  } else {
    buckets = MON.map((m,i) => { const l = list.filter(b => +b.finished_at.slice(5,7) === i+1); return Object.assign(goal(l), { label: m + " " + y, short: m.slice(0,1) }); });
    monthTitle = "Books finished by month";
  }

  const ratings = []; for (let r=8; r>=1; r--) ratings.push([r, list.filter(b => b.rating === r).length]);
  const decades = [...countBy(list, b => b.publication_year ? Math.floor(b.publication_year/10)*10 : null)].sort((a,b) => a[0]-b[0]);
  const fic = list.filter(b => (b.genre||[]).includes("fiction")).length, non = list.filter(b => (b.genre||[]).includes("non-fiction")).length;
  const genres = [...countBy(list, b => (b.genre||[]).filter(g => g !== "fiction" && g !== "non-fiction"))].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,10);
  const auth = [...countBy(list, b => b.author || [])].filter(e => e[1] > 1).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,10);
  const regionMap = new Map();
  list.forEach(b => (b.places || []).forEach(p => {
    const [reg, city] = p.split(/,\s*/); const e = regionMap.get(reg) || { n:0, books:new Set(), cities:new Set() };
    if (!e.books.has(b.slug)){ e.books.add(b.slug); e.n++; } if (city) e.cities.add(city); regionMap.set(reg, e);
  }));
  const places = [...regionMap].sort((a,b) => b[1].n - a[1].n || a[0].localeCompare(b[0]));
  const placed = list.filter(b => b.places && b.places.length).length;

  const html = `
  <div class="sec goal">
    <div>
      <h3>The goal <span>more books by everyone else than by white men</span></h3>
      <div class="tallies">
        <div class="ee"><b>${t.ee}</b><span>everyone else</span></div>
        <div class="wm"><b>${t.wm}</b><span>white men</span></div>
        <div class="un"><b>${t.un}</b><span>untagged</span></div>
      </div>
      <div class="split" role="img" aria-label="${t.ee} everyone else, ${t.wm} white men, ${t.un} untagged">
        <i style="width:${t.ee/tot*100}%;background:var(--violet)"></i><i style="width:${t.wm/tot*100}%;background:var(--red)"></i><i style="width:${t.un/tot*100}%;background:var(--graphite)"></i>
      </div>
      <p class="goal-note">${v.note}${t.un ? " " + plural(t.un, "book") + " untagged, counted on neither side." : ""}</p>
    </div>
    <div class="bigstamp ${v.cls}" role="img" aria-label="Verdict: ${v.word}">${v.word}<small>${y === "all" ? "All years" : y}</small></div>
  </div>
  <div class="sec">
    <h3>The year in numbers</h3>
    <div class="form">
      <div><label>Books finished</label><output>${s.books} <small>books</small></output></div>
      <div><label>Pages turned</label><output>${fmt(s.pages)} <small>pages</small></output></div>
      <div><label>Average rating</label><output>${s.avg == null ? "–" : s.avg.toFixed(1)}<small>/8</small></output><p>from ${plural(s.rated, "rated book")}</p></div>
      <div><label>Audiobooks</label><output>${s.aud + s.prn ? Math.round(s.aud/(s.aud+s.prn)*100) : 0}<small>%</small></output><p>${s.aud} audio, ${s.prn} print${s.unrec ? ", " + s.unrec + " not recorded" : ""}</p></div>
    </div>
  </div>
  <div class="sec"><h3>${monthTitle}</h3>${stackCols(buckets)}${monthNote ? `<p class="sub" style="margin:10px 0 0">${monthNote}</p>` : ""}</div>
  <div class="grid2">
    <div class="sec"><h3>Ratings <span>out of 8, ${plural(s.rated, "rated book")}</span></h3>${s.rated ? rows(ratings, { cls:"rate", label: r => "■".repeat(r) + " " + r + "/8" }) : '<p class="sub">No ratings recorded for these books.</p>'}</div>
    <div class="sec"><h3>Publication decade <span>books per decade</span></h3>${decades.length ? rows(decades, { label: d => d + "s" }) : '<p class="sub">No publication years recorded.</p>'}</div>
  </div>
  <div class="grid2">
    <div class="sec"><h3>Top genres <span>${fic} fiction, ${non} non-fiction</span></h3>${genres.length ? rows(genres) : '<p class="sub">No genres recorded.</p>'}</div>
    <div class="sec"><h3>Most-read authors <span>two or more books</span></h3>
      ${auth.length ? `<ul class="ledger">${auth.map(([a,n]) => `<li><span>${esc(a)}</span><span class="tally">${tallySVG(n)}<em>${plural(n,"book")}</em></span></li>`).join("")}</ul>` : '<p class="sub">No author was read twice in this year.</p>'}</div>
  </div>
  <div class="sec"><h3>Places <span>${plural(placed, "book")} with a setting recorded, ${plural(places.length, "region")}</span></h3>
    ${places.length ? `<ul class="ledger places">${places.map(([r,e]) => `<li><span>${esc(r)}${e.cities.size ? `<small>${esc([...e.cities].sort().join(", "))}</small>` : ""}</span><span class="tally"><em>${plural(e.n,"book")}</em></span></li>`).join("")}</ul>` : '<p class="sub">No settings recorded for these books.</p>'}
  </div>`;
  const el = document.getElementById("report");
  el.innerHTML = html;
  el.classList.remove("thunk"); if (animate){ void el.offsetWidth; el.classList.add("thunk"); }
}

/* ---------- wiring ---------- */
function setView(v){
  state.view = v;
  document.getElementById("tab-books").setAttribute("aria-selected", v === "books");
  document.getElementById("tab-dash").setAttribute("aria-selected", v === "dash");
  document.getElementById("v-books").hidden = v !== "books";
  document.getElementById("v-dash").hidden = v !== "dash";
  v === "books" ? renderShelf(false) : renderDash(true);
}
document.getElementById("tab-books").addEventListener("click", () => setView("books"));
document.getElementById("tab-dash").addEventListener("click", () => setView("dash"));
document.querySelector(".views").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const next = state.view === "books" ? "dash" : "books"; setView(next); document.getElementById(next === "books" ? "tab-books" : "tab-dash").focus();
});
function onGuide(e){
  const b = e.target.closest("button[data-year]"); if (!b) return;
  state.year = b.dataset.year;
  const grp = b.parentElement.id;
  state.view === "books" ? renderShelf(true) : renderDash(true);
  const again = document.querySelector(`#${grp} button[data-year="${state.year}"]`); if (again) again.focus();
}
document.getElementById("guides-books").addEventListener("click", onGuide);
document.getElementById("guides-dash").addEventListener("click", onGuide);
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; renderShelf(false); });

renderCounter(); renderNightstand(); renderShelf(false);
document.getElementById("foot").textContent = "Catalog as of " + dateLong(AS_OF) + ". Ratings are on an eight-point scale.";

if (typeof module !== "undefined") module.exports = { scoped, goal, verdict, stats, countBy, YEARS, renderDash, state };
})();
</script>
</body>
</html>
